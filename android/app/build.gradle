plugins {
    id 'com.android.application'
}

// build-apk.sh passes the ABIs and the version; the signing key comes from
// the environment (ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD,
// ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
def abis = ((findProperty('tmAbis') ?: 'arm64-v8a') as String).split(',').collect { it.trim() }
def versionCodeValue = ((findProperty('tmVersionCode') ?: '1') as String).toInteger()
def versionNameValue = (findProperty('tmVersionName') ?: 'dev') as String
def keystorePath = System.getenv('ANDROID_KEYSTORE')

android {
    namespace 'it.zerko.terraformingmars'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'it.zerko.terraformingmars'
        minSdk 26
        targetSdk 35
        versionCode versionCodeValue
        versionName versionNameValue
        externalNativeBuild {
            cmake {
                // libnode.so links against the shared C++ runtime.
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        ndk {
            abiFilters(*abis)
        }
    }

    signingConfigs {
        release {
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
