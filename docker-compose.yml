# Two instances of the game server behind one Caddy:
#   app            - main instance, built from the automa checkout
#   app-tournament - tournament instance, built from the tournament checkout
#
# The project name is pinned to `deploy` because the original setup derived it
# from this file's directory name. Changing it would orphan the production
# volumes (deploy_pgdata, deploy_caddy_*).
name: deploy

services:
  app:
    container_name: terraforming-mars
    build: ${MAIN_CHECKOUT:-../terraforming-mars}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - SERVER_ID=${SERVER_ID}
      - MAX_GAME_DAYS=${MAX_GAME_DAYS:-10}
      - GAME_CACHE=${GAME_CACHE:-sweep=auto;idle_age=336h}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - frontend
      - backend

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  app-tournament:
    build: ${TOURNAMENT_CHECKOUT:-../terraforming-mars-tournament}
    restart: unless-stopped
    depends_on:
      postgres-tournament:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgresql://${TOURNAMENT_POSTGRES_USER}:${TOURNAMENT_POSTGRES_PASSWORD}@postgres-tournament:5432/${TOURNAMENT_POSTGRES_DB}?sslmode=disable
      - SERVER_ID=${TOURNAMENT_SERVER_ID}
      - MAX_GAME_DAYS=${TOURNAMENT_MAX_GAME_DAYS:-10}
      - GAME_CACHE=${TOURNAMENT_GAME_CACHE:-sweep=auto;idle_age=336h}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - frontend
      - backend-tournament

  postgres-tournament:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${TOURNAMENT_POSTGRES_USER}
      - POSTGRES_PASSWORD=${TOURNAMENT_POSTGRES_PASSWORD}
      - POSTGRES_DB=${TOURNAMENT_POSTGRES_DB}
    volumes:
      - pgdata_tournament:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOURNAMENT_POSTGRES_USER} -d ${TOURNAMENT_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-tournament

  housie:
    container_name: housie
    build: ${HOUSIE_CHECKOUT:-../housie}
    restart: unless-stopped
    environment:
      - HOUSIE_PASSWORD=${HOUSIE_PASSWORD}
      - HOUSIE_SESSION_SECRET=${HOUSIE_SESSION_SECRET}
      - HOUSIE_USERS=${HOUSIE_USERS:-Kotek,Kocinka}
      - HOUSIE_TIMEZONE=${HOUSIE_TIMEZONE:-Europe/Warsaw}
    volumes:
      - housie_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # the housie image installs curl for exactly this (its JRE base ships neither curl nor wget)
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  # M5.2 Game Corner: a public Gen 5 OU Showdown server and pokebot's Platinum bot.
  # `showdown` is built from ./showdown at pokebot's pinned commit; `arena` from the
  # pokebot checkout (private repo, deploy key -- see README). The bot reaches the
  # server over backend-arena; Caddy reaches it over frontend; the host port on
  # 127.0.0.1 is the SSH-tunnel door (`ssh -L 8000:localhost:8000` +
  # https://localhost.psim.us/) if the hosted client's route ever misbehaves.
  showdown:
    container_name: showdown
    build: ./showdown
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8000/showdown/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - frontend
      - backend-arena

  arena:
    container_name: arena
    build: ${POKEBOT_CHECKOUT:-../pokebot}
    restart: unless-stopped
    depends_on:
      showdown:
        condition: service_healthy
    environment:
      - ARENA_SERVER=ws://showdown:8000/showdown/websocket
      - ARENA_BOT_NAME=${ARENA_BOT_NAME:-Platinum}
      - ARENA_CHALLENGERS=${ARENA_CHALLENGERS:-}
      - ARENA_GEN=5
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-arena

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - TOURNAMENT_DOMAIN=${TOURNAMENT_DOMAIN}
      # default must live BOTH here and in the Caddyfile placeholder: a set-but-empty
      # env var would otherwise defeat Caddy's own {$VAR:default} fallback
      - HOUSIE_DOMAIN=${HOUSIE_DOMAIN:-housie.localhost}
      - ARENA_DOMAIN=${ARENA_DOMAIN:-arena.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./502.html:/srv/502.html:ro
      - ./stars.jpg:/srv/stars.jpg:ro
      - ./housie-502.html:/srv/housie-502.html:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - frontend

networks:
  frontend:
  backend:
  backend-tournament:
  backend-arena:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  pgdata_tournament:
  housie_data:
